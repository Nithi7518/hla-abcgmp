# Image-only baseline (Phase 7). Nothing here is hard-coded into src/ -- backbone,
# learning rate, batch size, epoch count, class-imbalance strategy, and the random
# seed are all read from this file (CLI flags on `python -m src.train` override it).

experiment:
  name: baseline_resnet18_ft2
  seed: 42
  device: auto  # auto | cpu | cuda | mps -- auto picks the best available at runtime

data:
  audit_csv: ./results/dataset_audit.csv
  duplicate_groups_csv: ./data/manifests/duplicate_groups.csv
  classes_config: ./configs/classes.yaml
  data_root: ./data/raw
  manifests_dir: ./data/manifests

  # Only dataset_main is used by default -- Phase 3 found dataset_main/dataset_v1 are
  # two overlapping releases of the same photo collection (8,266 of 8,269 duplicate
  # groups span both). Using both without deduplication would silently double-count
  # nearly every photograph. See results/duplicate_detection_summary.md.
  source_collections: [dataset_main]

  # Phase 3 also found 332 images that are byte-identical across the apple/banana
  # crop labels (real apple stock photos filed under banana.cordana), plus 366
  # groups with same-crop cross-class duplicates. Any duplicate group whose members
  # carry more than one distinct label has an unknown true label for every member --
  # excluding them is the only defensible option pending manual relabeling. See
  # results/duplicate_detection_summary.md "CRITICAL FINDING".
  exclude_label_conflicting_duplicate_groups: true

  # Hand-reviewed per-image exclusions (wrong-label images that hash matching missed).
  manual_exclusions_csv: ./configs/manual_exclusions.csv

  # Transform-robust near-duplicate groups (python -m src.near_duplicates): the splitting unit.
  # Without them ~28% of the old test images had a flipped/rotated copy in train.
  robust_groups_csv: ./data/manifests/robust_groups.csv

  # full_class = crop + canonical_class composite (24-way; the actual per-crop
  #   diagnosis task this project is about).
  # disease_status = healthy vs diseased only (2-way; used later for cross-crop
  #   generalization, Phase 11).
  task: full_class

splitting:
  strategy: stratified_group
  # Splitting unit is the duplicate GROUP (Phase 3 output), not the image -- so no
  # near-duplicate or exact-duplicate pair can ever land in two different partitions.
  # Stratification target is the task label above, approximated via a greedy
  # per-class group assignment (exact stratification is not always possible once
  # group-membership is a hard constraint).
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

image:
  size: 224
  normalization: imagenet
  train_augmentation:
    horizontal_flip: true
    rotation_degrees: 15
    color_jitter: 0.1
    # Deliberately mild -- aggressive augmentation risks destroying disease
    # morphology (lesion shape/color/texture) that the model needs to learn.

model:
  backbone: resnet18  # resnet18 | resnet50 | efficientnet_b0 | efficientnet_b2
  pretrained: true
  freeze_backbone: true
  unfreeze_last_n_blocks: 2  # layer3 + layer4
  dropout: 0.3

training:
  batch_size: 64
  epochs: 20
  early_stopping_patience: 5
  early_stopping_metric: val_macro_f1
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  class_imbalance_strategy: class_weighted_loss  # class_weighted_loss | weighted_sampling | focal_loss | none
  num_workers: 4

output:
  experiments_dir: ./results/experiments
  checkpoints_dir: ./checkpoints
  logs_dir: ./logs
