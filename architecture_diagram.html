<title>ABCGMP Pipeline Architecture</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15181d; --fg: #e6e6e6; }
  }
  :root[data-theme="dark"] { --bg: #15181d; --fg: #e6e6e6; }
  body { background: var(--bg); color: var(--fg); margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  figure { margin: 0 auto; max-width: 900px; }
  svg { max-width: 100%; height: auto; display: block; color: var(--fg); background: var(--bg); }
  figcaption { font-size: 13px; opacity: 0.75; margin-top: 12px; line-height: 1.5; }
  .title-text { font-weight: 600; }
  .sub-text { fill-opacity: 0.72; }
</style>

<figure>
  <svg viewBox="0 0 900 1140" role="img" aria-label="Pipeline diagram: raw images flow through a dataset audit whose inventory feeds both duplicate detection and the splitter; splits feed a training entry point that checks whether real metadata exists — the baseline config proceeds to a trained checkpoint and evaluation, while the multimodal config is refused and exits with a documented reason.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <polygon points="0,0 10,5 0,10" fill="currentColor"></polygon>
      </marker>
      <marker id="arrowBlocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <polygon points="0,0 10,5 0,10" fill="#e8590c"></polygon>
      </marker>
    </defs>

    <!-- ============ LEGEND ============ -->
    <rect x="656" y="16" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.4"></rect>
    <text x="682" y="26" font-size="11" class="sub-text">process (script)</text>
    <rect x="656" y="36" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="682" y="46" font-size="11" class="sub-text">data artifact (file)</text>
    <line x1="656" y1="58" x2="674" y2="58" stroke="#e8590c" stroke-width="1.6"></line>
    <text x="682" y="62" font-size="11" class="sub-text">blocked path</text>

    <!-- ============ 1. RAW DATA ============ -->
    <rect x="140" y="20" width="240" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="260" y="41" text-anchor="middle" font-size="12" class="title-text">data/raw/</text>
    <text x="260" y="57" text-anchor="middle" font-size="10.5" class="sub-text">images only — no metadata file exists</text>

    <line x1="260" y1="70" x2="260" y2="106" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 2. DATASET AUDIT ============ -->
    <rect x="150" y="108" width="220" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
    <text x="260" y="132" text-anchor="middle" font-size="12" class="title-text">Dataset Audit</text>
    <text x="260" y="148" text-anchor="middle" font-size="10.5" class="sub-text">src/dataset_audit.py</text>
    <text x="260" y="161" text-anchor="middle" font-size="10.5" class="sub-text">scans files, hashes, dims</text>

    <!-- config note feeding audit -->
    <rect x="430" y="118" width="190" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3,2"></rect>
    <text x="525" y="135" text-anchor="middle" font-size="10.5" class="title-text">configs/classes.yaml</text>
    <text x="525" y="149" text-anchor="middle" font-size="9.5" class="sub-text">folder → crop/organ/label</text>
    <text x="525" y="160" text-anchor="middle" font-size="9.5" class="sub-text">(never hard-coded)</text>
    <line x1="430" y1="140" x2="374" y2="140" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"></line>

    <line x1="260" y1="168" x2="260" y2="198" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 3. AUDIT CSV ARTIFACT ============ -->
    <rect x="150" y="200" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="260" y="219" text-anchor="middle" font-size="11.5" class="title-text">dataset_audit.csv</text>
    <text x="260" y="234" text-anchor="middle" font-size="10" class="sub-text">per-image: crop, class, hash, dims</text>

    <!-- branch right to duplicate detection -->
    <polyline points="370,223 440,223 440,310 508,310" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></polyline>

    <!-- spine continues down (drawn after Data Loader box is placed, long line) -->
    <line x1="260" y1="246" x2="260" y2="418" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 4. DUPLICATE DETECTION (side branch) ============ -->
    <rect x="510" y="280" width="220" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
    <text x="620" y="304" text-anchor="middle" font-size="12" class="title-text">Duplicate Detection</text>
    <text x="620" y="320" text-anchor="middle" font-size="10.5" class="sub-text">src/duplicate_detection.py</text>
    <text x="620" y="333" text-anchor="middle" font-size="10.5" class="sub-text">SHA-256 ∪ 2-of-3 perceptual hash</text>

    <line x1="620" y1="340" x2="620" y2="374" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <rect x="510" y="376" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="620" y="395" text-anchor="middle" font-size="11.5" class="title-text">duplicate_groups.csv</text>
    <text x="620" y="410" text-anchor="middle" font-size="10" class="sub-text">leakage-safe grouping units</text>

    <!-- into data loader -->
    <polyline points="510,399 460,399 460,455 374,455" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></polyline>

    <!-- ============ 5. DATA LOADER / SPLITTER ============ -->
    <rect x="150" y="420" width="220" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
    <text x="260" y="443" text-anchor="middle" font-size="12" class="title-text">Data Loader + Splitter</text>
    <text x="260" y="459" text-anchor="middle" font-size="10.5" class="sub-text">src/data_loader.py</text>
    <text x="260" y="472" text-anchor="middle" font-size="10.5" class="sub-text">group-aware split; excludes</text>
    <text x="260" y="484" text-anchor="middle" font-size="10.5" class="sub-text">label-conflicting duplicate groups</text>

    <line x1="260" y1="490" x2="260" y2="518" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 6. SPLIT MANIFESTS ============ -->
    <rect x="150" y="520" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="260" y="539" text-anchor="middle" font-size="11.5" class="title-text">train.csv / val.csv / test.csv</text>
    <text x="260" y="554" text-anchor="middle" font-size="10" class="sub-text">23 labels · 6249 / 1347 / 1341 images</text>

    <!-- ============ 7. FORK: two configs enter src/train.py ============ -->
    <rect x="60" y="600" width="200" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3,2"></rect>
    <text x="160" y="617" text-anchor="middle" font-size="11" class="title-text">configs/baseline.yaml</text>
    <text x="160" y="631" text-anchor="middle" font-size="9.5" class="sub-text">metadata.enabled = false</text>

    <rect x="500" y="600" width="220" height="44" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3,2"></rect>
    <text x="610" y="617" text-anchor="middle" font-size="11" class="title-text">configs/multimodal.yaml</text>
    <text x="610" y="631" text-anchor="middle" font-size="9.5" class="sub-text">metadata.enabled = true</text>

    <text x="260" y="588" text-anchor="middle" font-size="10.5" class="sub-text" font-style="italic">both enter src/train.py — same entry point</text>

    <line x1="180" y1="644" x2="248" y2="678" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"></line>
    <line x1="590" y1="644" x2="278" y2="678" stroke="currentColor" stroke-width="1.3" marker-end="url(#arrow)"></line>

    <!-- decision diamond -->
    <polygon points="260,678 368,733 260,788 152,733" fill="none" stroke="currentColor" stroke-width="1.6"></polygon>
    <text x="260" y="723" text-anchor="middle" font-size="10.5" class="title-text">metadata status</text>
    <text x="260" y="737" text-anchor="middle" font-size="10.5" class="title-text">VALID or PARTIAL?</text>
    <text x="260" y="751" text-anchor="middle" font-size="9.5" class="sub-text">check_metadata_feasibility()</text>

    <!-- yes -> proceed -->
    <line x1="260" y1="788" x2="260" y2="816" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"></line>
    <text x="272" y="806" font-size="10" class="sub-text">yes (baseline)</text>

    <!-- no -> refused (blocked path, colored) -->
    <line x1="368" y1="733" x2="466" y2="733" stroke="#e8590c" stroke-width="1.6" marker-end="url(#arrowBlocked)"></line>
    <text x="418" y="723" text-anchor="middle" font-size="10" fill="#e8590c">no (multimodal)</text>

    <!-- ============ REFUSED (blocked terminal) ============ -->
    <rect x="470" y="705" width="210" height="56" rx="8" fill="none" stroke="#e8590c" stroke-width="1.6"></rect>
    <text x="575" y="728" text-anchor="middle" font-size="12" class="title-text" fill="#e8590c">MULTIMODAL REFUSED</text>
    <text x="575" y="743" text-anchor="middle" font-size="10" class="sub-text">exits before touching data</text>
    <text x="575" y="755" text-anchor="middle" font-size="10" class="sub-text">(no metadata to fabricate)</text>

    <line x1="575" y1="761" x2="575" y2="789" stroke="#e8590c" stroke-width="1.4" marker-end="url(#arrowBlocked)"></line>

    <rect x="465" y="791" width="220" height="50" rx="6" fill="none" stroke="#e8590c" stroke-width="1.3" stroke-dasharray="3,2"></rect>
    <text x="575" y="810" text-anchor="middle" font-size="10.5" class="title-text" fill="#e8590c">multimodal_and_ablation_</text>
    <text x="575" y="823" text-anchor="middle" font-size="10.5" class="title-text" fill="#e8590c">not_supported.md</text>
    <text x="575" y="835" text-anchor="middle" font-size="9.5" class="sub-text">written, not silently skipped</text>

    <!-- ============ 8. TRAIN LOOP (baseline path continues) ============ -->
    <rect x="150" y="816" width="220" height="66" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
    <text x="260" y="839" text-anchor="middle" font-size="12" class="title-text">ImageClassifier (ResNet18)</text>
    <text x="260" y="855" text-anchor="middle" font-size="10.5" class="sub-text">train/val loop · early stopping</text>
    <text x="260" y="868" text-anchor="middle" font-size="10.5" class="sub-text">class-weighted loss</text>

    <line x1="260" y1="882" x2="260" y2="910" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 9. CHECKPOINT ARTIFACT ============ -->
    <rect x="150" y="912" width="220" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="260" y="931" text-anchor="middle" font-size="11.5" class="title-text">checkpoint.pt</text>
    <text x="260" y="946" text-anchor="middle" font-size="10" class="sub-text">+ run_metadata.json (seed, git, versions)</text>

    <line x1="260" y1="958" x2="260" y2="986" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 10. EVALUATE ============ -->
    <rect x="150" y="988" width="220" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
    <text x="260" y="1010" text-anchor="middle" font-size="12" class="title-text">Evaluate</text>
    <text x="260" y="1026" text-anchor="middle" font-size="10.5" class="sub-text">src/evaluate.py · held-out test split</text>
    <text x="260" y="1038" text-anchor="middle" font-size="10.5" class="sub-text">(touched exactly once)</text>

    <line x1="260" y1="1044" x2="260" y2="1072" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></line>

    <!-- ============ 11. FINAL METRICS ARTIFACT ============ -->
    <rect x="120" y="1074" width="280" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3,2"></rect>
    <text x="260" y="1093" text-anchor="middle" font-size="11.5" class="title-text">metrics.json · confusion_matrix.png</text>
    <text x="260" y="1108" text-anchor="middle" font-size="10" class="sub-text">bootstrap 95% CIs, per-class report</text>
    <text x="260" y="1121" text-anchor="middle" font-size="10" class="sub-text">95.0% accuracy · 87.3% macro F1</text>
  </svg>
  <figcaption>
    The pipeline is a DAG, not a straight line: the audit's per-image inventory feeds
    both duplicate detection and the splitter directly, and a single fork in
    <code>src/train.py</code> decides everything downstream — the baseline config
    proceeds to a trained, evaluated checkpoint, while the multimodal config hits the
    same gate and is refused before touching any data, because this dataset has no
    real metadata to train on.
  </figcaption>
</figure>
